name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Validate Beer Atlas PR metadata
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/validate-beer-atlas-pr.mjs
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.22.0 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Show Prettier diff
        run: |
          pnpm format
          git diff -- .github/agents/beer-atlas-store.agent.md .github/ISSUE_TEMPLATE/beer-atlas-shop.yml docs/beer-atlas-copilot-store-workflow.md scripts/validate-beer-atlas-pr.mjs
          exit 1
      - name: Validate
        run: pnpm run ci
