name: Format visual portal

on:
  push:
    branches: [agent/visual-service-portal]

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'Apply Prettier formatting'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: agent/visual-service-portal
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.22.0 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/index.astro
          git commit -m "Apply Prettier formatting"
          git push origin HEAD:agent/visual-service-portal
