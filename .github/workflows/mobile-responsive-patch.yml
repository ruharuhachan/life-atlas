name: Apply mobile responsive tuning

on:
  push:
    branches:
      - agent/mobile-responsive-tuning

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply mobile responsive tuning'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: agent/mobile-responsive-tuning
      - name: Patch mobile styles
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/pages/index.astro')
          text = path.read_text()
          replacement = '''  @media (max-width: 760px) {
            .portal-hero__footer,
            .portal-intro__grid,
            .portal-next__grid {
              grid-template-columns: 1fr;
            }

            .portal-hero,
            .portal-hero__content {
              min-height: 72svh;
            }

            .portal-hero__content {
              padding-block: 1.25rem 1.8rem;
            }

            .portal-hero h1 {
              font-size: clamp(3.4rem, 16vw, 5.4rem);
            }

            .portal-hero__footer {
              align-items: start;
              gap: 0.9rem;
              margin-top: 1.6rem;
            }

            .portal-hero__footer p {
              font-size: 0.9rem;
              line-height: 1.65;
            }

            .portal-intro {
              padding: 4rem 0;
            }

            .portal-intro h2,
            .portal-next h2 {
              font-size: clamp(2.6rem, 12vw, 4rem);
            }

            .portal-services {
              grid-template-columns: 1fr;
            }

            .portal-card,
            .portal-card--wide {
              grid-column: auto;
              min-height: 54svh;
              padding: 1.25rem;
            }

            .portal-card--wide {
              min-height: 60svh;
            }

            .portal-card__content {
              gap: 0.8rem;
            }

            .portal-card__content h3,
            .portal-card--wide .portal-card__content h3 {
              font-size: clamp(1.55rem, 7vw, 2.25rem);
              line-height: 1.16;
            }

            .portal-card__arrow {
              width: 2.8rem;
              font-size: 1.1rem;
            }

            .portal-next {
              padding: 4.5rem 0;
            }

            .portal-next__grid {
              gap: 2rem;
            }
          }

'''
          replacement = re.sub(r'^ {10}', '', replacement, flags=re.MULTILINE)
          pattern = r'  @media \(max-width: 760px\) \{.*?(?=  @media \(prefers-reduced-motion: reduce\))'
          updated, count = re.subn(pattern, replacement, text, count=1, flags=re.DOTALL)
          if count != 1:
              raise SystemExit(f'Expected one mobile media block, found {count}')
          path.write_text(updated)
          PY
      - name: Commit tuning
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/index.astro
          git commit -m "Apply mobile responsive tuning"
          git push origin HEAD:agent/mobile-responsive-tuning
